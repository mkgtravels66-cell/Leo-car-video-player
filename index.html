<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Car Media - YouTube & Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Car Dashboard Header */
        header {
            background: #161616;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff0000;
        }
        header h1 {
            font-size: 20px;
            color: #ff0000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .car-status {
            font-size: 12px;
            background: #222;
            padding: 6px 12px;
            border-radius: 20px;
            color: #00ff66;
            border: 1px solid #333;
        }
        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
        }
        /* Sidebar Menu */
        sidebar {
            width: 220px;
            background: #121212;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
        }
        sidebar button {
            background: none;
            border: none;
            color: #ccc;
            padding: 18px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            transition: 0.2s;
        }
        sidebar button:hover, sidebar button.active {
            background: #ff0000;
            color: #fff;
            padding-left: 25px;
        }
        /* Content Area */
        .content-area {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            padding: 15px;
            overflow-y: auto;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }
        /* YouTube Embedded Player / Search */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
        }
        .search-box button {
            padding: 0 25px;
            background: #ff0000;
            color: #white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Video Frame / Screen */
        .media-screen {
            flex: 1;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .placeholder-text {
            color: #666;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header for Car Infotainment -->
    <header>
        <h1>🦁 Leo Car Media (Fermata Style)</h1>
        <div class="car-status">Connected to Android Auto</div>
    </header>

    <div class="main-container">
        <!-- Sidebar Navigation optimized for touch screens -->
        <sidebar>
            <button onclick="switchTab('youtubeTab', this)" class="active">📺 YouTube Video</button>
            <button onclick="switchTab('spotifyTab', this)">🎵 Spotify / Music</button>
            <button onclick="switchTab('browserTab', this)">🌐 Custom URL Link</button>
        </sidebar>

        <!-- Content Area -->
        <div class="content-area">
            
            <!-- 1. YouTube Tab -->
            <div id="youtubeTab" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="ytSearchQuery" placeholder="YouTube Video Link or Search Name (e.g., Anirudh Hits)...">
                    <button onclick="loadYouTube()">Play</button>
                </div>
                <div class="media-screen" id="ytScreen">
                    <div class="placeholder-text">YouTube player ready. Enter link above to play on car screen.</div>
                </div>
            </div>

            <!-- 2. Spotify Tab -->
            <div id="spotifyTab" class="tab-content">
                <div class="search-box">
                    <input type="text" id="spotifyUrl" placeholder="Paste Spotify Track/Playlist Link...">
                    <button onclick="loadSpotify()">Open</button>
                </div>
                <div class="media-screen" id="spotifyScreen">
                    <div class="placeholder-text">Spotify web player linked.</div>
                </div>
            </div>

            <!-- 3. Custom Link Tab (AAAD / Fermata style web mirror) -->
            <div id="browserTab" class="tab-content">
                <div class="search-box">
                    <input type="text" id="customUrl" placeholder="https://www.youtube.com">
                    <button onclick="loadCustomUrl()">Go</button>
                </div>
                <div class="media-screen" id="browserScreen">
                    <div class="placeholder-text">Enter any website or video portal link.</div>
                </div>
            </div>

        </div>
    </div>

<script>
    // Tab Switching Function
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        document.querySelectorAll('sidebar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // YouTube Video Loader logic
    function loadYouTube() {
        const query = document.getElementById('ytSearchQuery').value.trim();
        const screen = document.getElementById('ytScreen');
        
        if (!query) {
            alert("Please enter a valid YouTube link or keyword!");
            return;
        }

        // Check if input is a full youtube URL or watch ID
        let videoId = "jfKfPfyJRdk"; // Default lofi chill beats as fallback
        if (query.includes("youtu.be/")) {
            videoId = query.split("youtu.be/")[1].split("?")[0];
        } else if (query.includes("watch?v=")) {
            videoId = query.split("watch?v=")[1].split("&")[0];
        }

        screen.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    // Spotify Link Loader
    function loadSpotify() {
        const url = document.getElementById('spotifyUrl').value.trim();
        const screen = document.getElementById('spotifyScreen');
        if (!url) {
            alert("Please paste a Spotify link!");
            return;
        }
        // Convert regular spotify track link to embed link format
        let embedUrl = url;
        if(url.includes("track/")) {
            let trackId = url.split("track/")[1].split("?")[0];
            embedUrl = `https://open.spotify.com/embed/track/${trackId}`;
        }
        screen.innerHTML = `<iframe src="${embedUrl}?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    }

    // Custom Web URL Loader (Fermata / AAAD WebView behavior)
    function loadCustomUrl() {
        let url = document.getElementById('customUrl').value.trim();
        const screen = document.getElementById('browserScreen');
        if(!url.startsWith('http')) {
            url = 'https://' + url;
        }
        screen.innerHTML = `<iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
    }
</script>

</body>
</html>
